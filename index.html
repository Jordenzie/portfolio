<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Untitled</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/folder icon-2.png" />

  <link rel="stylesheet" href="css/main.css" />
</head>

<body data-page="home">
  <div class="desktop" id="desktop">
    <a href="pages/j-mac.html" class="icon" data-kind="folder">
      <img src="icons/folder icon-2.png" alt="Folder" />
      <span>J-Mac</span>
    </a>

    <a href="pages/1999-worldwide.html" class="icon" data-kind="folder">
      <img src="icons/folder icon-2.png" alt="Folder" />
      <span>1999 Worldwide</span>
    </a>

    <a href="#" class="icon" data-kind="text" data-file="quote">
      <img src="icons/txt.png" alt="Text File" />
      <span>Virgil.txt</span>
    </a>

    <a href="#" class="icon" data-kind="audio" data-audio="music/I Want U.mp3" data-title="I Want U">
      <img src="icons/cd.png" alt="MP3 File" />
      <span>I Want U.mp3</span>
    </a>

    <a href="#" class="icon" data-kind="album" data-title="Some Singles" data-tracks="music/Some Singles/Hard to Say Goodbye.mp3|music/Some Singles/Hard.mp3|music/Some Singles/Innerspace.mp3" data-track-names="Hard to Say Goodbye|Hard|Innerspace" data-artwork="music/Some Singles/ADVISORY.png">
      <img src="icons/cd.png" alt="Album" />
      <span>Some Singles</span>
    </a>

    <!-- read me.txt hidden for now -->

    <a href="#" class="icon" data-kind="trash">
      <img src="icons/trash can.png" alt="Trash" />
      <span>Trash</span>
    </a>
    <a href="#" class="icon" data-kind="reset">
      <img src="icons/redbutton.png" alt="Reset" />
      <span>Reset</span>
    </a>

  </div>

  <div class="taskbar">
    <div class="left-group">
      <button class="menu-item taskbar-item" id="aboutBtn" type="button" aria-label="About">
        <img src="icons/apple logo.png" alt="Apple Logo" class="menubar-folder" />
        <span class="taskbar-label">About</span>
      </button>

      <a class="menu-item taskbar-item" href="mailto:jam@prtf.io">
        <span class="taskbar-label">E-Mail</span>
      </a>
    </div>

    <div class="right-group">
      <div class="menubar-clock" id="menubarClock"></div>
      <button class="menu-item taskbar-item" id="findBtn" type="button" aria-label="Find">
        <img src="images/finder.png" alt="Find" class="menubar-search" />
        <span class="taskbar-label">Finder</span>
      </button>
    </div>
  </div>

  <div class="search-bar" id="searchBar">
    <input id="searchInput" type="text" placeholder="Find..." autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="popup-overlay" id="popupOverlay" aria-hidden="true"></div>

  <script src="js/main.js" defer></script>
</body>
</html>
